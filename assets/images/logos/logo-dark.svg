<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <!-- Luminous Champagne Gold Gradient for Dark Mode -->
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="45%" stop-color="#E5C365"/>
      <stop offset="100%" stop-color="#B88A28"/>
    </linearGradient>

    <!-- Imperial Royal Burgundy Medallion Gradient -->
    <linearGradient id="wineGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#722635"/>
      <stop offset="55%" stop-color="#541624"/>
      <stop offset="100%" stop-color="#2D0B13"/>
    </linearGradient>

    <!-- Subtle Radiant Gold Ambient Glow -->
    <filter id="goldGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E5C365" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crest Seal (Left aligned for LTR) -->
  <g transform="translate(8, 6)" filter="url(#goldGlowDark)">
    <!-- Outer ornate notched ring -->
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#goldGradDark)" stroke-width="1.2" stroke-dasharray="3 1.5"/>
    <!-- Rich Imperial Burgundy Medallion with Gold Rim -->
    <circle cx="24" cy="24" r="20" fill="url(#wineGradDark)" stroke="url(#goldGradDark)" stroke-width="1.5"/>
    <!-- Inner vintage diamond border -->
    <rect x="13" y="13" width="22" height="22" rx="2" fill="none" stroke="url(#goldGradDark)" stroke-width="0.8" transform="rotate(45 24 24)" opacity="0.65"/>
    <!-- Stylized Sommelier Goblet & Vintage Pedestal -->
    <path d="M19 15 H29 C29 21.5 25.5 24.5 24 25 C22.5 24.5 19 21.5 19 15 Z" fill="url(#goldGradDark)"/>
    <line x1="24" y1="25" x2="24" y2="33" stroke="url(#goldGradDark)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="18.5" y1="33" x2="29.5" y2="33" stroke="url(#goldGradDark)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Star of Terroir -->
    <polygon points="24,9 25,12 28,12 25.5,14 26.5,17 24,15 21.5,17 22.5,14 20,12 23,12" fill="url(#goldGradDark)"/>
  </g>

  <!-- Typography LTR Dark: High Contrast Crisp Ivory & Radiant Gold -->
  <text x="68" y="32" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">
    WINE <tspan fill="#E5C365">&amp;</tspan> CRAFT
  </text>
  <text x="70" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" letter-spacing="1.8" fill="#E5C365">
    GRAND CRU CELLARS &amp; RARE SPIRITS
  </text>
</svg>