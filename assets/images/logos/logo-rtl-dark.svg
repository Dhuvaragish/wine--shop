<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" dir="rtl">
  <defs>
    <linearGradient id="goldGradRtlDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7319"/>
    </linearGradient>
    <linearGradient id="wineGradRtlDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D0B14"/>
      <stop offset="100%" stop-color="#190408"/>
    </linearGradient>
    <filter id="goldGlowRtlDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Crest Seal (Right aligned for RTL) -->
  <g transform="translate(264, 6)" filter="url(#goldGlowRtlDark)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#goldGradRtlDark)" stroke-width="1.2" stroke-dasharray="3 1.5"/>
    <circle cx="24" cy="24" r="20" fill="url(#wineGradRtlDark)" stroke="url(#goldGradRtlDark)" stroke-width="1.5"/>
    <rect x="13" y="13" width="22" height="22" rx="2" fill="none" stroke="url(#goldGradRtlDark)" stroke-width="0.8" transform="rotate(45 24 24)" opacity="0.6"/>
    <path d="M19 15 H29 C29 21.5 25.5 24.5 24 25 C22.5 24.5 19 21.5 19 15 Z" fill="url(#goldGradRtlDark)"/>
    <line x1="24" y1="25" x2="24" y2="33" stroke="url(#goldGradRtlDark)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="18.5" y1="33" x2="29.5" y2="33" stroke="url(#goldGradRtlDark)" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="24,9 25,12 28,12 25.5,14 26.5,17 24,15 21.5,17 22.5,14 20,12 23,12" fill="url(#goldGradRtlDark)"/>
  </g>

  <!-- Typography RTL Dark -->
  <text x="252" y="32" text-anchor="end" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Cinzel', serif" font-size="22" font-weight="700" letter-spacing="1" fill="#FAF8F5">
    واين <tspan fill="#D4AF37">آند</tspan> كرافت
  </text>
  <text x="252" y="47" text-anchor="end" font-family="'Noto Sans Arabic', 'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#D4AF37">
    أقبية فاخرة ومشروبات نادرة • WINE &amp; CRAFT
  </text>
</svg>
